name: Verify ORIGO Capital Preview
on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'worlds/capital/**'
      - 'assets/images/capital/**'
      - '.github/workflows/vendor-capital-preview.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'worlds/capital/**'
      - 'assets/images/capital/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify local image and attribution
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          f=Path('assets/images/capital/island-moonlight-starryyino-cover.webp')
          blob=f.read_bytes()
          assert blob[:4]==b'RIFF' and blob[8:12]==b'WEBP' and len(blob)>3000
          assert hashlib.sha256(blob).hexdigest()=='2a7c4e454637539d6eb775025d3ebb0de5e835938b840d9f67ed9b02e8ff52bb'
          root=Path('README.md').read_text(encoding='utf-8')
          capital=Path('worlds/capital/README.md').read_text(encoding='utf-8')
          meta=json.loads(Path('worlds/capital/source.json').read_text(encoding='utf-8'))
          assert str(f) in root and '../../'+str(f) in capital and meta['image']==str(f)
          assert 'StarryYino' in root and 'StarryYino' in capital
          assert 'https://www.planetminecraft.com/project/island-moonlight-fantasy-build-download/' in root
          assert 'https://static.planetminecraft.com/files/image' not in root
          print('Locally hosted cover verified:',len(blob),'bytes')
          PY
